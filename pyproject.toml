# fitz-gov/pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fitz-gov"
version = "3.0.0"
description = "fitz-gov: Comprehensive RAG Governance Benchmark"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Fitz AI", email = "dev@fitz.ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["rag", "benchmark", "governance", "evaluation", "llm"]

dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yafitzdev/fitz-gov"
Documentation = "https://github.com/yafitzdev/fitz-gov#readme"
Repository = "https://github.com/yafitzdev/fitz-gov"
Issues = "https://github.com/yafitzdev/fitz-gov/issues"

[tool.hatch.build.targets.wheel]
packages = ["fitz_gov"]
include = [
    "/data",
]

[tool.hatch.build.targets.sdist]
include = [
    "/fitz_gov",
    "/data",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
